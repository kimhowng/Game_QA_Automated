name: Windows CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile and run the self-test
        shell: pwsh
        run: |
          cmd /c GameQA\build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath (Resolve-Path GameQA/GameQA.exe) -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Self-test exited with code $($test.ExitCode)." }
      - name: Package Windows executable
        shell: pwsh
        run: Compress-Archive -Path GameQA/GameQA.exe,GameQA/README.md -DestinationPath GameQA-Windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: GameQA-Windows-x64
          path: GameQA-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: GameQA-Windows-x64
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" GameQA-Windows-x64.zip --verify-tag --generate-notes
